<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemma AI - Local Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="layout-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="new-chat-btn">
                    <span class="icon">+</span>
                    New Chat
                </button>
            </div>
            
            <div class="chat-list-container">
                <h3 class="list-heading">Recent</h3>
                <ul id="chat-list" class="chat-list">
                    <!-- Session items will be dynamically injected here -->
                </ul>
            </div>
        </aside>

        <!-- Main Application Area -->
        <div class="app-container">
            <header class="app-header">
                <div class="logo">
                    <span class="logo-icon">✧</span>
                    <h1>Gemma Chat</h1>
                </div>
                
                <div class="model-selector">
                    <button class="model-btn" data-mode="fast">⚡ Fast</button>
                    <button class="model-btn active" data-mode="chat">🧠 Chat</button>
                    <button class="model-btn" data-mode="code">💻 Code</button>
                </div>
                
                <div class="header-actions">
                    <button id="bhashini-config-btn" class="model-btn" style="border: 1px dashed var(--border-color); color: var(--text-secondary);">
                        ⚙️ Bhashini API
                    </button>
                    <button id="edit-context-btn" class="model-btn" style="border: 1px dashed var(--border-color); color: var(--text-secondary);">
                        📄 Attach Context
                    </button>
                    <div class="status-indicator">
                        <span class="status-dot"></span>
                        <span class="status-text">Ollama Active</span>
                    </div>
                </div>
            </header>

            <main class="chat-container">
                <div id="chat-history" class="chat-history">
                    <!-- Messages will be injected here -->
                </div>
                <div id="loading-indicator" class="loading-indicator hidden">
                    <div class="spinner"></div>
                    <span>Gemma is thinking...</span>
                </div>
            </main>

            <footer class="app-footer">
                <form id="chat-form" class="chat-form">
                    <textarea id="message-input" placeholder="Message Gemma..." rows="1" autofocus></textarea>
                    <button type="submit" id="send-button" aria-label="Send message">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
                <p class="disclaimer">Responses are generated locally and securely. Context is maintained automatically.</p>
            </footer>
        </div>
    </div>

    <!-- Bhashini Configuration Modal -->
    <div id="bhashini-modal" class="modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center;">
        <div style="background: var(--bg-secondary); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color); width: 400px; max-width: 90%;">
            <h2 style="margin-bottom: 1rem; color: var(--text-primary);">Bhashini API Configuration</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">Retrieve these from your Bhashini Government Dashboard.</p>
            
            <label style="display:block; margin-bottom: 0.5rem; color: var(--text-primary); font-size: 0.9rem;">API Key / Auth Token</label>
            <input type="password" id="bhashini-key" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: white; margin-bottom: 1rem;">
            
            <label style="display:block; margin-bottom: 0.5rem; color: var(--text-primary); font-size: 0.9rem;">Target Language Code</label>
            <select id="bhashini-lang" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: white; margin-bottom: 1.5rem;">
                <option value="mr">Marathi</option>
                <option value="hi">Hindi</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
            </select>

            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button id="close-bhashini-modal" style="padding: 0.5rem 1rem; background: transparent; color: var(--text-secondary); border: none; cursor: pointer; border-radius: 6px;">Close</button>
                <button id="save-bhashini-config" style="padding: 0.5rem 1rem; background: var(--accent-color); color: white; border: none; cursor: pointer; border-radius: 6px; box-shadow: var(--shadow-sm);">Save Config</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
